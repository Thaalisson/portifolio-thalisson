# netlify.toml

[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "22" }  # jsdom's undici dep requires Node >=22.19

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
